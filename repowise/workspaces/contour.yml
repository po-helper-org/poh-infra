# Workspace `contour` — «как устроены сами агенты».
#
# Правила отбора и alias — docs/repowise/workspaces.md (R1–R9). Коротко:
# репозиторий состоит ровно в одном workspace, alias равен имени на GitHub без
# владельца и не сокращается, порог включения — история git и больше 10 файлов.
#
# Первый в списке становится репозиторием по умолчанию: запрос без alias падает
# на него, и это должен быть самый крупный и центральный репозиторий контура.

repos:
  - repo: po-helper-org/poh-issue-agents
    alias: poh-issue-agents
  - repo: po-helper-org/poh-infra
    alias: poh-infra
  - repo: po-helper-org/poh-pr-agents
    alias: poh-pr-agents
  - repo: po-helper-org/poh-helper
    alias: poh-helper
  - repo: po-helper-org/poh-cortex
    alias: poh-cortex
  - repo: po-helper-org/poh-memory-engine
    alias: poh-memory-engine
  - repo: po-helper-org/poh-sprint-agents
    alias: poh-sprint-agents
  - repo: po-helper-org/poh-bft-writer
    alias: poh-bft-writer
  - repo: po-helper-org/poh-scheduller
    alias: poh-scheduller

# НЕ включены по правилу R6 (нет истории либо 10 файлов и меньше — контекста не
# несут, а шум в list_repos дают):
#   poh-pr-closer (1 файл), poh-po-task (3), poh-security-agent (2)
#
# НЕ включены, потому что репозитория не существует (проверено 19.08.2026):
#   poh-backlog-skills — рабочая копия локальная, remote не заведён вовсе.
#
# Про poh-helper: локально каталог называется poh-core, но на GitHub это
# po-helper-org/poh-helper. Alias берётся от имени НА GITHUB (правило R3) —
# именно его агент увидит в ответе MCP как указание на источник.
