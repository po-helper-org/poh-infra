# Workspace `product` — «что агенты пишут».
#
# Разделение с `contour` обосновано качеством ответов, а не будущим ростом:
# вопрос про целевой репозиторий не должен притягивать ответ про устройство
# самих агентов. Цена разделения — один контейнер и этот файл.
#
# Добавить репозиторий = добавить строку. Индексатор подхватит его на ближайшем
# цикле: склонирует, зарегистрирует в workspace и проиндексирует.

repos:
  - repo: po-helper-org/poh-demo-checkout
    alias: poh-demo-checkout
