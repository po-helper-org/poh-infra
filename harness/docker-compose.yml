# Harness контура производства — весь цикл одним конфигом.
#
# Issue-Agent, PR-Agent и Temporal живут в отдельных репозиториях со своими
# релизными циклами, и каждый умеет подниматься сам. Но связать их — значит
# согласовать руками два GitHub App, общий секрет докладов, адрес соседа и
# namespace Temporal; ровно на этом согласовании контур и рвался. Здесь связка
# записана один раз.
#
#   GitHub ──webhook──▶ caddy ──/issue/*──▶ issue-webhook ──▶ Temporal ──▶ issue-worker
#                         │                                                     │
#                         │                                          workflow_dispatch
#                         │                                                     ▼
#                         └──/pr/*──▶ pr-ingress ─▶ pr-worker         OpenHands (Actions)
#                                                       │                       │
#                                                       └──── /agent-event ◀────┘
#
# Образы собираются ПРЯМО ИЗ git-репозиториев: копия исходников рядом не нужна,
# и версия сервиса не может незаметно разойтись с тем, что в main.
#
# Контекст задаётся ОДНОЙ переменной целиком, а не парой «репозиторий + ветка»:
# в неё кладут и `…git#ветка`, и локальный путь к рабочей копии. Пара ломалась
# на втором: путь с суффиксом `#ref` — не путь. А отлаживать доработку, собирая
# её из уже запушенного main, значит проверять не то, что правишь.
#
# ВАЖНО про git-контекст: BuildKit кэширует клон по URL, и `build` после нового
# коммита в ту же ветку может молча собрать прежний код. На отладке ставь
# локальный путь; на стенде добавляй `--no-cache`, когда ветка не менялась.
#
# Запуск:  cp .env.example .env && $EDITOR .env && docker compose up -d --build
# Проверка: curl -fsS http://localhost:${HARNESS_PORT:-8080}/health

x-issue-env: &issue-env
  # --- аутентификация в GitHub ---
  # Имена внутри сервисов совпадают у обоих агентов (GITHUB_APP_ID и т.д.), а
  # приложения РАЗНЫЕ: у Issue-Agent свои права и свои события, у PR-Agent свои.
  # Поэтому в harness они разведены префиксом и раскладываются здесь.
  GITHUB_APP_ID: "${ISSUE_APP_ID:-}"
  GITHUB_PRIVATE_KEY_B64: "${ISSUE_APP_PRIVATE_KEY_B64:-}"
  GITHUB_WEBHOOK_SECRET: "${ISSUE_APP_WEBHOOK_SECRET:?задай ISSUE_APP_WEBHOOK_SECRET}"
  GH_TOKEN: "${GH_TOKEN:-}"
  ISSUE_AGENT_REPOS: "${WATCHED_REPOS:?задай WATCHED_REPOS}"
  GITHUB_REPOSITORY: "${DEFAULT_REPO:-}"

  # --- Temporal (встроенный) ---
  TEMPORAL_ADDRESS: "temporal:7233"
  TEMPORAL_NAMESPACE: "default"
  TEMPORAL_SEARCH_ATTRIBUTES: "${TEMPORAL_SEARCH_ATTRIBUTES:-}"

  # --- модель ---
  ZAI_BASE_URL: "${ZAI_BASE_URL:-https://api.z.ai/api/coding/paas/v4}"
  ZAI_API_KEY: "${ZAI_API_KEY:?задай ZAI_API_KEY}"
  MODEL_GATE: "${MODEL_GATE:-glm-4.5-air}"
  MODEL_CLASSIFY: "${MODEL_CLASSIFY:-glm-4.6}"
  # Стадии БФТ, идущие прямыми вызовами модели вместо `claude -p` (каждый его
  # запуск — ~356 МБ RSS). Пусто = прежнее поведение целиком.
  BFT_DIRECT_STAGES: "${BFT_DIRECT_STAGES:-}"
  BFT_DIRECT_MODEL: "${BFT_DIRECT_MODEL:-glm-4.6}"

  # --- контур ---
  # Тот же секрет, что у PR-Agent ниже: это две стороны одного канала. Пусто →
  # /agent-event закрыт (503), и доклады о PR и ревью не дойдут — цикл останется
  # ждать в in-development навсегда.
  AGENT_EVENT_SECRET: "${AGENT_EVENT_SECRET:?задай AGENT_EVENT_SECRET}"
  DEVELOP_ENABLED: "${DEVELOP_ENABLED:-}"
  # Две парковки основного пути — два тумблера. Пробрасывать надо ОБА: одна
  # переменная в .env без пары в compose просто не доезжает до контейнера, и
  # выглядит это как «тумблер не работает».
  RESEARCH_AUTOSTART: "${RESEARCH_AUTOSTART:-}"
  DEVELOP_AUTOSTART: "${DEVELOP_AUTOSTART:-}"
  # `local` — код пишется здесь же, одноразовым контейнером. `dispatch` —
  # прогон уезжает в GitHub Actions репозитория-цели.
  DEVELOP_MODE: "${DEVELOP_MODE:-local}"
  DEVELOP_RUNNER_IMAGE: "${DEVELOP_RUNNER_IMAGE:-poh-openhands-runner:local}"
  DEVELOP_WORKSPACE_VOLUME: "${DEVELOP_WORKSPACE_VOLUME:-poh-dev-workspace}"
  DEVELOP_WORKSPACE_MOUNT: "/workspaces"
  DEVELOP_MODEL: "${DEVELOP_MODEL:-openai/glm-4.6}"
  DEVELOP_TEST_COMMAND: "${DEVELOP_TEST_COMMAND:-}"
  DEVELOP_TIMEOUT_SEC: "${DEVELOP_TIMEOUT_SEC:-2700}"
  DEVELOP_WORKFLOW_FILE: "${DEVELOP_WORKFLOW_FILE:-openhands-resolver.yml}"
  DEVELOP_REF: "${DEVELOP_REF:-main}"
  AGENT_TRIGGER_ALLOWLIST: "${AGENT_TRIGGER_ALLOWLIST:-}"

  # --- Repowise: постоянный индекс кода ---
  # Пусто — интеграция выключена целиком, и это ШТАТНЫЙ режим: стадия `repowise`
  # деградирует, пишет артефакт с исходом «источник недоступен» и конвейер идёт
  # дальше. Сервис живёт отдельным compose (`../repowise/`), контуру виден
  # только его прокси и только по общей сети.
  REPOWISE_PROXY_URL: "${REPOWISE_PROXY_URL:-}"
  REPOWISE_AGENT_TOKEN: "${REPOWISE_AGENT_TOKEN:-}"
  # Репозитории workspace `contour`. ВНИМАНИЕ: пусто здесь означает «всё
  # относится к product», а НЕ «всё разрешено», как в ISSUE_AGENT_REPOS.
  REPOWISE_CONTOUR_REPOS: "${REPOWISE_CONTOUR_REPOS:-}"
  REPOWISE_MAX_TURNS: "${REPOWISE_MAX_TURNS:-12}"
  # Сеть, в которой одноразовый контейнер разработки видит прокси. Воркер
  # передаёт её имя раннеру строкой в `docker run --network`, а тот стартует на
  # хосте и compose-псевдонимов не знает — поэтому имя, а не ссылка.
  REPOWISE_NETWORK: "${REPOWISE_NETWORK:-}"

  # --- сроки парковок ---
  PARK_DECISION_HOURS: "${PARK_DECISION_HOURS:-72}"
  PARK_CLARIFICATION_HOURS: "${PARK_CLARIFICATION_HOURS:-48}"
  PARK_BUILD_HOURS: "${PARK_BUILD_HOURS:-72}"
  PARK_SIDE_STATE_HOURS: "${PARK_SIDE_STATE_HOURS:-168}"

  # --- режим и наблюдаемость ---
  # `${VAR-default}` без двоеточия: пустое значение здесь ЗНАЧИМО и означает
  # боевой режим. С `:-` пустая строка считалась бы «не задано», подставлялся
  # бы дефолт `1`, и выключение DRY_RUN не срабатывало бы вовсе — стадии
  # проходят, в GitHub не появляется ничего, и выглядит это как исправная
  # работа.
  DRY_RUN: "${DRY_RUN-1}"
  SENTRY_DSN: "${SENTRY_DSN:-}"
  SENTRY_ENVIRONMENT: "${SENTRY_ENVIRONMENT:-harness}"
  # Слаг организации Sentry — из него собирается ССЫЛКА на событие в комментарии
  # к Issue. В DSN его нет (там только числовой id), поэтому без этой переменной
  # человек получает голый id события и ищет его в интерфейсе руками — проверено
  # живым сбоем #41: комментарий пришёл, ссылки в нём не было.
  SENTRY_ORG: "${SENTRY_ORG:-}"
  PYTHONUNBUFFERED: "1"

# Обязательность PR-переменных проверяется НЕ подстановкой, а на старте самого
# сервиса (см. команду pr-ingress). Подстановка срабатывает на весь файл разом,
# и жёсткий guard здесь не давал бы поднять issue-половину без второго App —
# то есть не давал бы проверить первую половину вовсе.
x-pr-env: &pr-env
  OPENAI_KEY: "${ZAI_API_KEY:?задай ZAI_API_KEY}"
  OPENAI_API_BASE: "${ZAI_BASE_URL:-https://api.z.ai/api/coding/paas/v4}"
  CONFIG_MODEL: "${PR_AGENT_MODEL:-openai/glm-4.6}"
  CONFIG_AI_TIMEOUT: "${CONFIG_AI_TIMEOUT:-600}"
  GITHUB_APP_ID: "${PR_APP_ID:-}"
  GITHUB_PRIVATE_KEY_B64: "${PR_APP_PRIVATE_KEY_B64:-}"
  GITHUB_WEBHOOK_SECRET: "${PR_APP_WEBHOOK_SECRET:-}"
  RELIABILITY_DB: "/data/reliability.db"
  RELIABILITY_QUEUE: "/data/queue.db"
  RELIABILITY_MAX_ATTEMPTS: "${RELIABILITY_MAX_ATTEMPTS:-5}"
  # Адрес соседа — внутренний, не публичный: доклад идёт по сети compose и
  # наружу не выходит вовсе. Публичный URL здесь означал бы, что событие о фазе
  # задачи делает петлю через интернет без всякой причины.
  ISSUE_AGENT_URL: "http://issue-webhook:3000"
  AGENT_EVENT_SECRET: "${AGENT_EVENT_SECRET:?задай AGENT_EVENT_SECRET}"
  SENTRY_DSN: "${SENTRY_DSN:-}"
  SENTRY_ENVIRONMENT: "${SENTRY_ENVIRONMENT:-harness}"
  # Слаг организации Sentry — из него собирается ССЫЛКА на событие в комментарии
  # к Issue. В DSN его нет (там только числовой id), поэтому без этой переменной
  # человек получает голый id события и ищет его в интерфейсе руками — проверено
  # живым сбоем #41: комментарий пришёл, ссылки в нём не было.
  SENTRY_ORG: "${SENTRY_ORG:-}"

services:
  # ─────────────────────────── Temporal ───────────────────────────

  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?задай POSTGRES_PASSWORD (openssl rand -hex 24)}"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal"]
      interval: 5s
      timeout: 5s
      retries: 10

  temporal:
    image: temporalio/auto-setup:1.24
    restart: unless-stopped
    environment:
      DB: postgres12
      DB_PORT: "5432"
      POSTGRES_USER: temporal
      POSTGRES_PWD: "${POSTGRES_PASSWORD:?задай POSTGRES_PASSWORD}"
      POSTGRES_SEEDS: postgres
    expose: ["7233"]
    depends_on:
      postgres:
        condition: service_healthy

  temporal-ui:
    image: temporalio/ui:2.31.2
    restart: unless-stopped
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      # CORS должен знать публичный адрес, иначе браузер режет собственные
      # запросы страницы.
      TEMPORAL_CORS_ORIGINS: "${PUBLIC_URL:-http://localhost:8080}"
      # НЕ ставить TEMPORAL_UI_PUBLIC_PATH: этот образ — SPA с base-path,
      # зашитым в сборку как "" (пусто), свои ассеты (`/_app/...`) он просит
      # абсолютными путями независимо от значения этой переменной — она
      # двигает только серверные API-роуты самого UI, а не фронтенд. Отсюда
      # требование в Caddyfile: UI живёт на корне домена, не под префиксом.
    # Прямой порт помимо префикса: когда до UI надо дойти в обход прокси
    # (проверить, что пусто именно из-за маршрутизации, а не из-за самого UI).
    # Слушает ТОЛЬКО loopback: наружный вход закрыт basic-auth'ом на caddy, и
    # тот же UI, торчащий вторым портом в мир, снимал бы эту защиту целиком.
    # С хоста — `curl localhost:8233`, снаружи — через ssh-туннель.
    ports:
      - "127.0.0.1:${TEMPORAL_UI_PORT:-8233}:8080"
    expose: ["8080"]
    # Уникальное имя в сети контура. Короткое `temporal-ui` НЕ годится: на хосте
    # может жить одноимённый контейнер соседнего стека, и caddy — который состоит
    # и в сети контура, и в общей сети реверс-прокси, — резолвит имя в СОСЕДА.
    # Так публичный UI контура однажды показывал чужой Temporal целиком.
    networks:
      default:
        aliases: [harness-temporal-ui]
    depends_on: [temporal]

  # ────────────────────────── Issue-Agent ─────────────────────────

  issue-webhook:
    build:
      context: "${ISSUE_AGENT_CONTEXT:-https://github.com/po-helper-org/poh-issue-agents.git#main}"
      dockerfile: webhook/Dockerfile
    image: poh-issue-agent-webhook:harness
    restart: unless-stopped
    environment: *issue-env
    expose: ["3000"]
    depends_on: [temporal]

  # Образ агента разработки. Как и pr-agent-base — не сервис, а сборка: сам
  # прогон поднимается воркером на время задачи и умирает вместе с ней.
  openhands-runner:
    build:
      context: "${ISSUE_AGENT_CONTEXT:-https://github.com/po-helper-org/poh-issue-agents.git#main}"
      dockerfile: openhands/Dockerfile
    image: "${DEVELOP_RUNNER_IMAGE:-poh-openhands-runner:local}"
    entrypoint: ["/bin/true"]
    restart: "no"

  issue-worker:
    build:
      context: "${ISSUE_AGENT_CONTEXT:-https://github.com/po-helper-org/poh-issue-agents.git#main}"
      dockerfile: worker/Dockerfile
    image: poh-issue-agent-worker:harness
    restart: unless-stopped
    environment: *issue-env
    volumes:
      # Общий том с раннером: воркер готовит каталог задачи и читает результат,
      # раннер пишет. Bind-mount тут не годится — путь внутри воркера на хосте
      # не существует, и раннер смонтировал бы пустоту.
      - dev-workspace:/workspaces
      # Сокет нужен, чтобы поднять одноразовый контейнер агента. Это осознанная
      # уступка: воркер получает доступ к демону хоста. Взамен произвольный код
      # чужого репозитория исполняется НЕ здесь, а в контейнере, который живёт
      # минуты и не видит ни GitHub-токена, ни истории Temporal.
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on: [temporal, openhands-runner]
    # Вторая сеть — та, в которой виден прокси Repowise. Внешняя и общая с
    # compose сервиса; заводится один раз: `docker network create
    # poh-repowise-net`. Сервис не поднят — сеть всё равно существует, и
    # воркер штатно деградирует на проверке доступности.
    networks: [default, poh-repowise-net]

  # ─────────────────────────── PR-Agent ───────────────────────────

  # Одноразовая сборка апстрим-образа: не «служит», только тегирует образ, от
  # которого наследуется reliability. /bin/true → контейнер сразу выходит.
  pr-agent-base:
    profiles: ["pr"]
    build:
      context: https://github.com/qodo-ai/pr-agent.git
      dockerfile: docker/Dockerfile
      target: github_app
    image: pr-agent-github-app:local
    entrypoint: ["/bin/true"]
    restart: "no"

  pr-ingress:
    profiles: ["pr"]
    build:
      context: "${PR_AGENT_CONTEXT:-https://github.com/po-helper-org/poh-pr-agents.git#main:self-hosted}"
      dockerfile: Dockerfile.reliability
    image: pr-agent-reliability:harness
    restart: unless-stopped
    depends_on: [pr-agent-base]
    environment: *pr-env
    # Guard на старте вместо guard'а на подстановке: PR-Agent умеет только
    # GitHub App (PAT-пути у него нет), и без ключа он поднялся бы и молча
    # отвергал каждую доставку по 401.
    command:
      - sh
      - -c
      - |
        [ -n "$$GITHUB_APP_ID" ] && [ -n "$$GITHUB_PRIVATE_KEY_B64" ] || {
          echo "PR_APP_ID / PR_APP_PRIVATE_KEY_B64 не заданы — PR-Agent работает только как GitHub App" >&2
          exit 1
        }
        exec uvicorn reliability.app:app --host 0.0.0.0 --port 3000
    volumes: [pr-data:/data]
    expose: ["3000"]

  pr-worker:
    profiles: ["pr"]
    image: pr-agent-reliability:harness
    restart: unless-stopped
    depends_on: [pr-ingress]
    environment:
      <<: *pr-env
      # Инвариант порядка: CONFIG_AI_TIMEOUT ≤ ATTEMPT < TASK < VISIBILITY.
      # Меняешь один — держи порядок, иначе внешний слой рвёт идущее ревью либо
      # плодит дубль в очереди.
      RELIABILITY_ATTEMPT_TIMEOUT: "${RELIABILITY_ATTEMPT_TIMEOUT:-630}"
      RELIABILITY_TASK_TIMEOUT: "${RELIABILITY_TASK_TIMEOUT:-660}"
      RELIABILITY_VISIBILITY_TIMEOUT: "${RELIABILITY_VISIBILITY_TIMEOUT:-720}"
      RELIABILITY_LLM_RPS: "${RELIABILITY_LLM_RPS:-3}"
      RELIABILITY_BACKOFF: "${RELIABILITY_BACKOFF:-10}"
    command: ["python", "-m", "reliability.worker"]
    volumes: [pr-data:/data]

  pr-sweeper:
    profiles: ["pr"]
    image: pr-agent-reliability:harness
    restart: unless-stopped
    depends_on: [pr-ingress]
    environment:
      <<: *pr-env
      # Тот же список репозиториев, что следит Issue-Agent: два агента одного
      # контура, разъехавшийся охват означал бы PR без ревью либо ревью без
      # задачи.
      RELIABILITY_REPOS: "${WATCHED_REPOS:?задай WATCHED_REPOS}"
      RELIABILITY_COMMANDS: "${RELIABILITY_COMMANDS:-/describe,/review}"
      RELIABILITY_SWEEP_INTERVAL: "${RELIABILITY_SWEEP_INTERVAL:-300}"
    command: ["python", "-m", "reliability.sweeper_runner"]
    volumes: [pr-data:/data]

  # ──────────────────────── Публичный вход ────────────────────────

  # Один хост наружу вместо трёх портов. Два GitHub App шлют вебхуки на разные
  # пути одного домена, и это единственный адрес, который приходится где-либо
  # прописывать.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "${HARNESS_PORT:-8080}:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    # Учётка на Temporal UI (см. Caddyfile). Хэш, не пароль: конфиг входа
    # читается в логах и в `docker inspect`, и открытый пароль там означал бы
    # секрет, разъехавшийся по местам, где его никто не ищет.
    #
    # Отдельным файлом, а НЕ `environment:` из общего .env: Dokploy переписывает
    # .env из панели на каждом своём деплое, и учётка, заведённая мимо панели,
    # пропадала бы молча — вместе со всем входом.
    #
    # ВАЖНО про хэш: compose интерполирует значения и здесь, и в .env, а bcrypt
    # состоит из `$`-сегментов. Записывать хэш надо с УДВОЕННЫМИ долларами
    # (`$$2a$$14$$xyz`), иначе он доедет до контейнера обрезанным и вход будет
    # отвергать верный пароль — при внешне исправном контейнере.
    #
    # Оба файла необязательны, и это НЕ дыра: без переменных Caddyfile не
    # собирается, caddy не поднимается вовсе, и UI наружу не выходит. Отсутствие
    # учётки роняет вход, а не открывает его.
    env_file:
      # Локальный запуск: файл рядом с compose, в .gitignore.
      - path: ./caddy.env
        required: false
      # Стенд: вне рабочей копии, переживает деплой из панели Dokploy.
      - path: /etc/poh-harness/temporal-ui-auth.env
        required: false
    # Маршруты Traefik описаны ЗДЕСЬ, а не только в панели Dokploy: панель
    # заводит роутер лишь на entrypoint `web`, и по https любой хост падал в
    # дефолтный самоподписанный сертификат с 404. Сертификат берётся резолвером
    # `letsencrypt` — он задан глобально на entrypoint `websecure` самого
    # Dokploy-Traefik, поэтому здесь достаточно назвать entrypoint.
    #
    # Роутер на `web` остаётся без редиректа на https: GitHub за редиректами
    # вебхука не идёт, и 308 на /issue/webhook выглядел бы как принятая, но
    # никуда не дошедшая доставка.
    labels:
      - traefik.enable=true
      - traefik.docker.network=dokploy-network
      - traefik.http.services.poh-harness.loadbalancer.server.port=80
      - traefik.http.routers.poh-harness-web.rule=Host(`${HARNESS_HOST:-harness.localhost}`)
      - traefik.http.routers.poh-harness-web.entrypoints=web
      - traefik.http.routers.poh-harness-web.service=poh-harness
      - traefik.http.routers.poh-harness-websecure.rule=Host(`${HARNESS_HOST:-harness.localhost}`)
      - traefik.http.routers.poh-harness-websecure.entrypoints=websecure
      - traefik.http.routers.poh-harness-websecure.service=poh-harness
      - traefik.http.routers.poh-harness-websecure.tls=true
      - traefik.http.routers.poh-harness-websecure.tls.certresolver=letsencrypt
    # pr-ingress намеренно НЕ в depends_on: половина ревью включается профилем,
    # и жёсткая зависимость не дала бы поднять вход без неё.
    depends_on: [issue-webhook, temporal-ui]
    networks: [default, dokploy-network]

# Сеть Traefik заводится Dokploy'ем и общая на весь сервер — здесь она внешняя.
# Локальному запуску без Dokploy сеть не нужна: `docker network create
# dokploy-network` один раз, либо убрать `networks` у caddy.
networks:
  dokploy-network:
    external: true
  # Общая с compose сервиса Repowise. В ней виден ТОЛЬКО его прокси —
  # MCP-эндпоинты и админка остаются за ним и наружу не выходят.
  poh-repowise-net:
    external: true

volumes:
  pgdata:
  pr-data:
  # Имя фиксировано: воркер передаёт его раннеру строкой в `docker run -v`,
  # а тот запускается на хосте и compose-псевдонимов не знает.
  dev-workspace:
    name: "${DEVELOP_WORKSPACE_VOLUME:-poh-dev-workspace}"
